name: Build Mod Menu
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Unzip Project
      run: unzip modmenu.zip
      
    - name: Fix All Errors Definitely
      run: |
        # 1. Baixa o arquivo Java original
        curl -sL https://raw.githubusercontent.com/NepMods/Android-Mod-Menu/main/app/src/main/java/com/android/support/FloatingWindowManager.java -o Android-Mod-Menu/app/src/main/java/com/android/support/FloatingWindowManager.java
        
        # 2. Escreve o script Python num arquivo separado
        cat << 'PY_EOF' > fix.py
import sys
file_path = 'Android-Mod-Menu/app/src/main/java/com/android/support/FloatingWindowManager.java'
with open(file_path, 'r') as f:
    content = f.read()

gesture_code = '''
        rootView.setOnTouchListener(new View.OnTouchListener() {
            float startY = 0;
            boolean isHidden = false;
            @Override
            public boolean onTouch(View v, MotionEvent event) {
                if (event.getPointerCount() == 3) {
                    switch (event.getActionMasked()) {
                        case MotionEvent.ACTION_DOWN: startY = event.getY(); break;
                        case MotionEvent.ACTION_UP:
                            float deltaY = event.getY() - startY;
                            if (deltaY > 200 && !isHidden) {
                                rootView.setVisibility(View.GONE); isHidden = true;
                            } else if (deltaY < -200 && isHidden) {
                                rootView.setVisibility(View.VISIBLE); isHidden = false;
                            }
                            break;
                    }
                    return true;
                }
                return false;
            }
        });
        windowManager.addView(rootView, params);
'''
content = content.replace('windowManager.addView(rootView, params);', gesture_code)
with open(file_path, 'w') as f:
    f.write(content)
PY_EOF

        # 3. Executa o Python
        python3 fix.py
        
        # 4. Garante os imports do MotionEvent
        sed -i 's/import android.view.View;/import android.view.View;\nimport android.view.MotionEvent;/g' Android-Mod-Menu/app/src/main/java/com/android/support/FloatingWindowManager.java
        
        # 5. Arruma as cores do DeepSeek
        cat << 'EOF' > Android-Mod-Menu/app/src/main/res/values/colors.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <color name="colorPrimary">#1E1E2E</color>
            <color name="colorPrimaryDark">#1E1E2E</color>
            <color name="colorAccent">#4D6BFE</color>
            <color name="backgroundColor">#1E1E2E</color>
            <color name="textColor">#FFFFFF</color>
            <color name="textColorPrimary">#FFFFFF</color>
            <color name="textColorSecondary">#B0B0B0</color>
            <color name="iconColor">#4D6BFE</color>
        </resources>
        EOF

        # 6. Conserta a biblioteca de Threads no C++
        CPP_FILE=$(find Android-Mod-Menu -name "Main.cpp" | head -n 1)
        sed -i '1i #include <pthread.h>' "$CPP_FILE"
        
    - name: Build with Gradle
      run: |
        cd Android-Mod-Menu
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: native-libs
        path: Android-Mod-Menu/app/build/intermediates/merged_native_libs/debug/out/lib/
