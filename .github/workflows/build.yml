name: Build Mod Menu
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Unzip Project
      run: unzip modmenu.zip
      
    - name: Fix Java, Colors and C++ Thread
      run: |
        # 1. Arruma as cores do DeepSeek
        cat << 'EOF' > Android-Mod-Menu/app/src/main/res/values/colors.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <color name="colorPrimary">#1E1E2E</color>
            <color name="colorPrimaryDark">#1E1E2E</color>
            <color name="colorAccent">#4D6BFE</color>
            <color name="backgroundColor">#1E1E2E</color>
            <color name="textColor">#FFFFFF</color>
            <color name="textColorPrimary">#FFFFFF</color>
            <color name="textColorSecondary">#B0B0B0</color>
            <color name="iconColor">#4D6BFE</color>
        </resources>
        EOF
        
        # 2. Conserta os caminhos do Java
        find Android-Mod-Menu/app/src/main/java -name "*.java" -exec sed -i 's/com.android.support.base.FloatingWindowManager/com.android.support.FloatingWindowManager/g' {} +
        
        # 3. Conserta o erro do pthread no C++
        CPP_FILE=$(find Android-Mod-Menu -name "Main.cpp" | head -n 1)
        sed -i '1i #include <pthread.h>' "$CPP_FILE"
        
    - name: Build with Gradle
      run: |
        cd Android-Mod-Menu
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: native-libs
        path: Android-Mod-Menu/app/build/intermediates/merged_native_libs/debug/out/lib/
