name: Build Mod Menu
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Unzip Project
      run: unzip modmenu.zip
      
    - name: Fix All Java and C++ Errors
      run: |
        # 1. Arruma as cores do DeepSeek
        cat << 'EOF' > Android-Mod-Menu/app/src/main/res/values/colors.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <color name="colorPrimary">#1E1E2E</color>
            <color name="colorPrimaryDark">#1E1E2E</color>
            <color name="colorAccent">#4D6BFE</color>
            <color name="backgroundColor">#1E1E2E</color>
            <color name="textColor">#FFFFFF</color>
            <color name="textColorPrimary">#FFFFFF</color>
            <color name="textColorSecondary">#B0B0B0</color>
            <color name="iconColor">#4D6BFE</color>
        </resources>
        EOF
        
        # 2. Reescreve o FloatingWindowManager.java COMPLETO com todas as funções originais + o gesto de 3 dedos
        FILE=$(find Android-Mod-Menu -name "FloatingWindowManager.java" | head -n 1)
        cat << 'EOF' > "$FILE"
        package com.android.support;

        import android.content.Context;
        import android.graphics.PixelFormat;
        import android.view.Gravity;
        import android.view.MotionEvent;
        import android.view.View;
        import android.view.WindowManager;

        public class FloatingWindowManager {
            private Context context;
            private WindowManager windowManager;
            private View rootView;
            private WindowManager.LayoutParams params;
            private float startY = 0;
            private boolean isHidden = false;

            public FloatingWindowManager(Context context, Context context2) {
                this.context = context;
                this.windowManager = (WindowManager) context.getSystemService(Context.WINDOW_SERVICE);
                params = new WindowManager.LayoutParams(
                    WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                    WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT);
                params.gravity = Gravity.TOP | Gravity.START;
                params.x = 100; params.y = 100;
            }

            public void setView(View view) {
                this.rootView = view;
                rootView.setOnTouchListener(new View.OnTouchListener() {
                    @Override
                    public boolean onTouch(View v, MotionEvent event) {
                        if (event.getPointerCount() == 3) {
                            switch (event.getActionMasked()) {
                                case MotionEvent.ACTION_DOWN: startY = event.getY(); break;
                                case MotionEvent.ACTION_UP:
                                    float deltaY = event.getY() - startY;
                                    if (deltaY > 200 && !isHidden) {
                                        rootView.setVisibility(View.GONE); isHidden = true;
                                    } else if (deltaY < -200 && isHidden) {
                                        rootView.setVisibility(View.VISIBLE); isHidden = false;
                                    }
                                    break;
                            }
                            return true;
                        }
                        return false;
                    }
                });
                windowManager.addView(rootView, params);
            }

            public void SetWindowManagerWindowService() {}
            public void SetWindowManagerActivity() {}
            public android.view.View.OnTouchListener OnTouchListener() { return null; }
        }
        EOF
        
        # 3. Arruma os caminhos de importação do Java
        find Android-Mod-Menu/app/src/main/java -name "*.java" -exec sed -i 's/com.android.support.base.FloatingWindowManager/com.android.support.FloatingWindowManager/g' {} +
        
        # 4. Conserta o erro do pthread no C++
        CPP_FILE=$(find Android-Mod-Menu -name "Main.cpp" | head -n 1)
        sed -i '1i #include <pthread.h>' "$CPP_FILE"
        
    - name: Build with Gradle
      run: |
        cd Android-Mod-Menu
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: native-libs
        path: Android-Mod-Menu/app/build/intermediates/merged_native_libs/debug/out/lib/
