name: Build Mod Menu
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Unzip Project
      run: unzip modmenu.zip
      
    - name: Fix Colors and Java Package
      run: |
        # 1. Arruma as cores do DeepSeek
        cat << 'EOF' > Android-Mod-Menu/app/src/main/res/values/colors.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <color name="colorPrimary">#1E1E2E</color>
            <color name="colorPrimaryDark">#1E1E2E</color>
            <color name="colorAccent">#4D6BFE</color>
            <color name="backgroundColor">#1E1E2E</color>
            <color name="textColor">#FFFFFF</color>
            <color name="textColorPrimary">#FFFFFF</color>
            <color name="textColorSecondary">#B0B0B0</color>
            <color name="iconColor">#4D6BFE</color>
        </resources>
        EOF
        
        # 2. Conserta a pasta do Java
        # Move o arquivo para a pasta correta (sem o /base)
        mkdir -p Android-Mod-Menu/app/src/main/java/com/android/support/
        find Android-Mod-Menu -path "*base/FloatingWindowManager.java" -exec mv {} Android-Mod-Menu/app/src/main/java/com/android/support/ \;
        
        # Atualiza todas as importações para o pacote novo
        find Android-Mod-Menu/app/src/main/java -name "*.java" -exec sed -i 's/com.android.support.base.FloatingWindowManager/com.android.support.FloatingWindowManager/g' {} +
        
        # Garante que a declaração do pacote dentro do arquivo está correta
        sed -i 's/package com.android.support.base;/package com.android.support;/g' Android-Mod-Menu/app/src/main/java/com/android/support/FloatingWindowManager.java
        
    - name: Setup Android Environment and NDK
      run: |
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        echo "sdk.dir=$ANDROID_SDK_ROOT" > Android-Mod-Menu/local.properties
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529" "cmake;3.22.1" > /dev/null
        
    - name: Build with Gradle
      run: |
        cd Android-Mod-Menu
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: native-libs
        path: Android-Mod-Menu/app/build/intermediates/merged_native_libs/debug/out/lib/
