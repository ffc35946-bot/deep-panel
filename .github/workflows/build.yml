name: Build Mod Menu
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Unzip Project
      run: unzip modmenu.zip
      
    - name: Fix Java, Colors and C++ Thread
      run: |
        # 1. Cria a pasta BASE correta e escreve o arquivo na mão
        mkdir -p Android-Mod-Menu/app/src/main/java/com/android/support/base
        
        printf '%s\n' \
        "package com.android.support.base;" \
        "" \
        "import android.content.Context;" \
        "import android.graphics.PixelFormat;" \
        "import android.view.Gravity;" \
        "import android.view.MotionEvent;" \
        "import android.view.View;" \
        "import android.view.WindowManager;" \
        "" \
        "public class FloatingWindowManager {" \
        "    private Context context;" \
        "    private WindowManager windowManager;" \
        "    private View rootView;" \
        "    private WindowManager.LayoutParams params;" \
        "    private boolean isHidden = false;" \
        "    private float startY = 0;" \
        "" \
        "    public FloatingWindowManager(Context context, Object shared) {" \
        "        this.context = context;" \
        "        this.windowManager = (WindowManager) context.getSystemService(Context.WINDOW_SERVICE);" \
        "        params = new WindowManager.LayoutParams(" \
        "            WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT," \
        "            WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY," \
        "            WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT);" \
        "        params.gravity = Gravity.TOP | Gravity.START;" \
        "        params.x = 100;" \
        "        params.y = 100;" \
        "    }" \
        "" \
        "    public void setView(View view) {" \
        "        this.rootView = view;" \
        "        rootView.setOnTouchListener(new View.OnTouchListener() {" \
        "            @Override" \
        "            public boolean onTouch(View v, MotionEvent event) {" \
        "                if (event.getPointerCount() == 3) {" \
        "                    switch (event.getActionMasked()) {" \
        "                        case MotionEvent.ACTION_DOWN: startY = event.getY(); break;" \
        "                        case MotionEvent.ACTION_UP:" \
        "                            float deltaY = event.getY() - startY;" \
        "                            if (deltaY > 200 && !isHidden) {" \
        "                                rootView.setVisibility(View.GONE); isHidden = true;" \
        "                            } else if (deltaY < -200 && isHidden) {" \
        "                                rootView.setVisibility(View.VISIBLE); isHidden = false;" \
        "                            }" \
        "                            break;" \
        "                    }" \
        "                    return true;" \
        "                }" \
        "                return false;" \
        "            }" \
        "        });" \
        "        windowManager.addView(rootView, params);" \
        "    }" \
        "" \
        "    public void SetWindowManagerWindowService() {}" \
        "    public void SetWindowManagerActivity() {}" \
        "    public View.OnTouchListener OnTouchListener() { return null; }" \
        "}" > Android-Mod-Menu/app/src/main/java/com/android/support/base/FloatingWindowManager.java
        
        # 2. Arruma as cores do DeepSeek
        printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="colorPrimary">#1E1E2E</color>\n    <color name="colorPrimaryDark">#1E1E2E</color>\n    <color name="colorAccent">#4D6BFE</color>\n    <color name="backgroundColor">#1E1E2E</color>\n    <color name="textColor">#FFFFFF</color>\n    <color name="textColorPrimary">#FFFFFF</color>\n    <color name="textColorSecondary">#B0B0B0</color>\n    <color name="iconColor">#4D6BFE</color>\n</resources>' > Android-Mod-Menu/app/src/main/res/values/colors.xml
        
        # 3. Conserta a biblioteca de Threads no C++
        CPP_FILE=$(find Android-Mod-Menu -name "Main.cpp" | head -n 1)
        sed -i '1i #include <pthread.h>' "$CPP_FILE"
        
    - name: Build with Gradle
      run: |
        cd Android-Mod-Menu
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: native-libs
        path: Android-Mod-Menu/app/build/intermediates/merged_native_libs/debug/out/lib/
