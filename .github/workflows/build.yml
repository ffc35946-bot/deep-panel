name: Build Mod Menu
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Unzip Project
      run: unzip modmenu.zip
      
    - name: Build with Gradle
      run: |
        cd Android-Mod-Menu
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: native-libs
        path: Android-Mod-Menu/app/build/intermediates/merged_native_libs/debug/out/lib/
